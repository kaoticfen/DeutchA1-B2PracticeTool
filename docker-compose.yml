services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: deutsch
      MYSQL_USER: deutsch
      MYSQL_PASSWORD: deutsch
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udeutsch", "-pdeutsch"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://deutsch:deutsch@db:3306/deutsch"
      AUTH_SECRET: "${AUTH_SECRET:-dev-only-secret-change-me}"
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"

volumes:
  db_data:
